<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Bot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        textarea,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #eee;
            white-space: pre-wrap;
        }

        #answer {
            margin-top: 15px;
            padding: 15px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 8px;
            white-space: pre-wrap;
            min-height: 50px;
        }

        .small {
            font-size: 13px;
            color: #666;
        }

        .online {
            color: green;
            font-weight: bold;
        }

        .offline {
            color: red;
            font-weight: bold;
        }

        a.download {
            display: block;
            text-align: center;
            padding: 12px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Bot</h1>

    <!-- CONNECTION -->
    <div class="card">

        <h2>Server</h2>

        <p class="small">
            GitHub Pages → Public API → Termux app.py
        </p>

        <!-- CHANGE THIS -->
        <input
            id="apiUrl"
            type="url"
            placeholder="https://your-public-api-address"
        >

        <button onclick="saveAPI()">
            Save API Address
        </button>

        <button onclick="testConnection()">
            Test Termux Server
        </button>

        <div id="connectionStatus">
            Not tested
        </div>

    </div>


    <!-- AI CHAT -->
    <div class="card">

        <h2>💬 AI Chat</h2>

        <textarea
            id="message"
            placeholder="Type your message..."
        ></textarea>

        <button id="chatButton" onclick="sendMessage()">
            Send
        </button>

        <div id="status">
            Ready
        </div>

        <div id="answer"></div>

    </div>


    <!-- VIDEO DOWNLOADER -->
    <div class="card">

        <h2>📥 Video Downloader</h2>

        <p class="small">
            Paste a supported video URL.
        </p>

        <input
            id="videoUrl"
            type="url"
            placeholder="Paste video URL here"
        >

        <button id="downloadButton" onclick="downloadVideo()">
            Download
        </button>

        <div id="downloadStatus">
            Ready
        </div>

        <div id="downloadResult"></div>

    </div>

</div>


<script>

/*
==================================================
API CONFIGURATION
==================================================

IMPORTANT:

Do NOT use:

http://127.0.0.1:5000

That means the visitor's own device.

Your GitHub website needs a PUBLIC HTTPS address
that forwards to your Termux app.py.

Example:

https://example.com

or

https://something.example

*/


const API_URL = "https://58678cd99ed332.lhr.life";


/* Show saved API address */

document.getElementById("apiUrl").value = API_URL;


/*
==================================================
SAVE API
==================================================
*/

function saveAPI() {

    let url = document.getElementById("apiUrl").value.trim();

    if (!url) {
        alert("Enter your public API address.");
        return;
    }

    // Remove trailing slash
    url = url.replace(/\/+$/, "");

    API_URL = url;

    localStorage.setItem("API_URL", API_URL);

    document.getElementById("apiUrl").value = API_URL;

    document.getElementById("connectionStatus").innerHTML =
        '<span class="online">API address saved.</span>';
}


/*
==================================================
 CHECK API
==================================================
*/

async function testConnection() {

    if (!API_URL) {
        alert("Enter and save your API address first.");
        return;
    }

    const status =
        document.getElementById("connectionStatus");

    status.innerHTML = "Connecting...";

    try {

        /*
        Your Flask app should ideally have:

        GET /
        or
        GET /api/health

        We try /api/health first.
        */

        const response = await fetch(
            `${API_URL}/api/health`,
            {
                method: "GET"
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.text();

        status.innerHTML =
            `<span class="online">✓ Termux server is online</span>\n${data}`;

    } catch (error) {

        console.error(error);

        status.innerHTML =
            `<span class="offline">✗ Connection failed</span>\n${error.message}`;
    }
}


/*
==================================================
 AI CHAT
==================================================
*/

async function sendMessage() {

    if (!API_URL) {
        alert("Save your API address first.");
        return;
    }

    const message =
        document.getElementById("message").value.trim();

    if (!message) {
        alert("Type a message.");
        return;
    }

    const button =
        document.getElementById("chatButton");

    const status =
        document.getElementById("status");

    const answer =
        document.getElementById("answer");

    button.disabled = true;

    status.textContent = "Thinking...";

    answer.textContent = "";

    try {

        const response = await fetch(
            `${API_URL}/api/chat`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || `HTTP ${response.status}`
            );
        }

        /*
        Supports several common Flask responses:

        {"response":"Hello"}
        {"answer":"Hello"}
        {"message":"Hello"}
        */

        const text =
            data.response ??
            data.answer ??
            data.message ??
            JSON.stringify(data);

        answer.textContent = text;

        status.textContent = "Done";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Error: " + error.message;

        answer.textContent =
            "Could not connect to the Termux AI server.";
    }

    button.disabled = false;
}


/*
==================================================
 VIDEO DOWNLOAD
==================================================
*/

async function downloadVideo() {

    if (!API_URL) {
        alert("Save your API address first.");
        return;
    }

    const url =
        document.getElementById("videoUrl")
        .value.trim();

    if (!url) {
        alert("Paste a video URL.");
        return;
    }

    const button =
        document.getElementById("downloadButton");

    const status =
        document.getElementById("downloadStatus");

    const result =
        document.getElementById("downloadResult");

    button.disabled = true;

    status.textContent =
        "Starting download...";

    result.innerHTML = "";

    try {

        const response = await fetch(
            `${API_URL}/api/download`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    url: url
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || `HTTP ${response.status}`
            );
        }

        status.textContent =
            "Download ready!";

        /*
        Your Flask API can return:

        {
            "download_url":
            "https://..."
        }
        */

        if (data.download_url) {

            result.innerHTML = `
                <a
                    class="download"
                    href="${data.download_url}"
                    download
                >
                    📥 Download File
                </a>
            `;

        } else {

            result.textContent =
                JSON.stringify(data, null, 2);
        }

    } catch (error) {

        console.error(error);

        status.textContent =
            "Download error: " + error.message;
    }

    button.disabled = false;
}


/*
==================================================
 ENTER KEY
==================================================
*/

document
    .getElementById("message")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

            event.preventDefault();

            sendMessage();
        }
    });

</script>

</body>
</html>
