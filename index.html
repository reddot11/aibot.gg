<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Bot by:Al Manalo </title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

header {
    background: #111827;
    color: white;
    padding: 22px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 15px;
}

header h1 {
    margin: 0 0 8px;
}

.status {
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
    background: #374151;
}

.online {
    color: #22c55e;
}

.offline {
    color: #ef4444;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

input,
textarea,
select {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

.secondary {
    background: #4b5563;
}

.chat {
    height: 350px;
    overflow-y: auto;
    padding: 10px;
    background: #f9fafb;
    border-radius: 10px;
    margin-bottom: 10px;
}

.message {
    max-width: 90%;
    padding: 10px 12px;
    margin: 8px 0;
    border-radius: 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.user {
    background: #dbeafe;
    margin-left: auto;
}

.bot {
    background: #e5e7eb;
}

.progress {
    display: none;
    margin-top: 15px;
}

.progress-bg {
    height: 20px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width .3s;
}

.progress-text {
    text-align: center;
    margin-top: 6px;
}

.result {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #f3f4f6;
    border-radius: 8px;
}

.download {
    display: block;
    text-align: center;
    text-decoration: none;
    color: white;
    background: #16a34a;
    padding: 13px;
    border-radius: 9px;
    margin-top: 10px;
    font-weight: bold;
}

.small {
    color: #6b7280;
    font-size: 13px;
}

footer {
    text-align: center;
    color: #6b7280;
    padding: 20px;
}

@media(max-width:600px) {
    .card {
        padding: 15px;
    }

    .chat {
        height: 300px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

<h1>🤖 AI Bot</h1>

<p>
AI Chat • YouTube • Facebook
</p>

<div id="status" class="status">
🔄 Connecting to Termux...
</div>

</header>


<!-- =====================================================
     AI CHAT
====================================================== -->

<div class="card">

<h2>💬 AI Chat</h2>

<div id="chat" class="chat">

<div class="message bot">
Hello! 👋
Ask me anything.
</div>

</div>


<textarea
id="message"
rows="3"
placeholder="Type your message..."
></textarea>


<button
id="send"
onclick="sendMessage()"
>
Send
</button>

</div>


<!-- =====================================================
     AI MODEL
====================================================== -->

<div class="card">

<h2>🧠 Ollama Model</h2>

<select id="model">

<option value="qwen2.5:1.5b">
qwen2.5:1.5b
</option>

<option value="qwen2.5:0.5b">
qwen2.5:0.5b
</option>

</select>

<button
class="secondary"
onclick="loadModels()"
>
Refresh Models
</button>

</div>


<!-- =====================================================
     VIDEO DOWNLOADER
====================================================== -->

<div class="card">

<h2>⬇️ Video Downloader</h2>

<p class="small">
YouTube, YouTube Shorts, Facebook videos and Facebook Reels
</p>


<input
id="videoUrl"
type="url"
placeholder="Paste video URL here..."
>


<select id="format">

<option value="mp4">
MP4 Video
</option>

<option value="mp3">
MP3 Audio
</option>

</select>


<button
id="downloadButton"
onclick="downloadVideo()"
>
Download
</button>


<div
id="progress"
class="progress"
>

<div class="progress-bg">

<div
id="progressBar"
class="progress-bar"
></div>

</div>

<div
id="progressText"
class="progress-text"
>
Starting...
</div>

</div>


<div
id="result"
class="result"
></div>

</div>


<!-- =====================================================
     SERVER
====================================================== -->

<div class="card">

<h2>🔌 Server</h2>

<p class="small">
Current Termux :
</p>

<input
id="Display"
readonly
>

<button
class="secondary"
onclick="checkConnection()"
>
Test Connection
</button>

</div>


<footer>
AI Bot • GitHub Pages + Termux + Ollama
</footer>

</div>


<script>

/*
===========================================================
IMPORTANT
===========================================================

This is the PUBLIC Flask/Tunnel URL.

DO NOT use:

http://127.0.0.1:11434

That address is Ollama and is only accessible from Termux.

The browser connects to Flask through the tunnel.
*/

const API_URL =
"https://cfd584bdbe2d18.lhr.life/";


document.getElementById("apiDisplay").value =
API_URL;


/*
===========================================================
CONNECTION
===========================================================
*/

async function checkConnection() {

    const status =
        document.getElementById("status");

    status.className = "status";

    status.innerHTML =
        "🔄 Connecting to Termux...";


    try {

        const response =
            await fetch(
                API_URL + "/api/health",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if (data.status === "online") {

            status.className =
                "status online";

            status.innerHTML =
                "🟢 Termux is ONLINE";

            console.log(
                "Termux:",
                data
            );

        } else {

            throw new Error(
                "Server returned offline"
            );

        }


    } catch (error) {

        status.className =
            "status offline";

        status.innerHTML =
            "🔴 Termux is OFFLINE";

        console.error(
            "Connection error:",
            error
        );

    }
}


/*
===========================================================
LOAD MODELS
===========================================================
*/

async function loadModels() {

    try {

        const response =
            await fetch(
                API_URL + "/api/models",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        const select =
            document.getElementById("model");


        select.innerHTML = "";


        if (
            data.models &&
            data.models.length
        ) {

            data.models.forEach(
                function(name) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value = name;

                    option.textContent =
                        name;

                    if (
                        name === data.current
                    ) {

                        option.selected = true;

                    }

                    select.appendChild(
                        option
                    );

                }
            );

        }


    } catch (error) {

        console.error(
            "Model error:",
            error
        );

    }
}


/*
===========================================================
CHAT
===========================================================
*/

async function sendMessage() {

    const input =
        document.getElementById("message");

    const button =
        document.getElementById("send");

    const chat =
        document.getElementById("chat");


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    /*
    User message
    */

    const user =
        document.createElement("div");

    user.className =
        "message user";

    user.textContent =
        message;

    chat.appendChild(user);


    input.value = "";

    button.disabled = true;


    /*
    Thinking
    */

    const thinking =
        document.createElement("div");

    thinking.className =
        "message bot";

    thinking.textContent =
        "🤔 Thinking...";

    chat.appendChild(thinking);


    chat.scrollTop =
        chat.scrollHeight;


    try {

        const model =
            document.getElementById(
                "model"
            ).value;


        const response =
            await fetch(
                API_URL + "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message: message,

                        model: model

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Chat request failed"
            );

        }


        thinking.remove();


        const bot =
            document.createElement("div");

        bot.className =
            "message bot";


        bot.textContent =
            data.response ||
            data.reply ||
            data.message ||
            "No response.";


        chat.appendChild(bot);


    } catch (error) {

        thinking.textContent =
            "❌ " + error.message;

        console.error(
            "Chat error:",
            error
        );

    } finally {

        button.disabled = false;

        chat.scrollTop =
            chat.scrollHeight;

    }
}


/*
===========================================================
ENTER TO SEND
===========================================================
*/

document
.getElementById("message")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/*
===========================================================
VIDEO DOWNLOAD
===========================================================
*/

async function downloadVideo() {

    const url =
        document
        .getElementById("videoUrl")
        .value
        .trim();


    const format =
        document
        .getElementById("format")
        .value;


    const button =
        document
        .getElementById(
            "downloadButton"
        );


    const progress =
        document
        .getElementById("progress");


    const bar =
        document
        .getElementById(
            "progressBar"
        );


    const progressText =
        document
        .getElementById(
            "progressText"
        );


    const result =
        document
        .getElementById("result");


    if (!url) {

        alert(
            "Paste a video URL first."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Downloading...";


    progress.style.display =
        "block";


    result.style.display =
        "none";


    bar.style.width =
        "5%";


    progressText.textContent =
        "Starting...";


    /*
    Visual progress
    */

    let percent = 5;


    const timer =
        setInterval(
            function() {

                if (percent < 90) {

                    percent += 3;

                    bar.style.width =
                        percent + "%";

                    progressText.textContent =
                        "Processing... " +
                        percent +
                        "%";

                }

            },
            500
        );


    try {

        const response =
            await fetch(
                API_URL + "/api/download",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        url: url,

                        format: format

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Download failed"
            );

        }


        clearInterval(timer);


        bar.style.width =
            "100%";


        progressText.textContent =
            "✅ Download ready!";


        let downloadUrl =
            data.download_url ||
            data.url ||
            data.file;


        if (!downloadUrl) {

            throw new Error(
                "No download URL returned."
            );

        }


        /*
        Flask returns relative URL:
        /api/file/xxxxx.mp4

        Convert it to the public URL.
        */

        if (
            downloadUrl.startsWith("/")
        ) {

            downloadUrl =
                API_URL +
                downloadUrl;

        }


        result.style.display =
            "block";


        result.innerHTML =

            "<strong>✅ Ready!</strong>" +

            "<a class='download' " +
            "href='" +
            downloadUrl +
            "' target='_blank' download>" +
            "⬇️ Download File" +
            "</a>";


    } catch (error) {

        clearInterval(timer);


        bar.style.width =
            "0%";


        progressText.textContent =
            "❌ Failed";


        result.style.display =
            "block";


        result.textContent =
            "❌ " +
            error.message;


        console.error(
            "Download error:",
            error
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "Download";

    }
}


/*
===========================================================
START
===========================================================
*/

window.addEventListener(
    "DOMContentLoaded",
    async function() {

        await checkConnection();

        await loadModels();

    }
);

</script>

</body>
</html>
